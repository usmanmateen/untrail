name: Build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          $version = if ($ref -match '^v(\d+\.\d+\.\d+.*)$') { $Matches[1] } else { '0.0.0-dev' }
          ./build.ps1 -Version $version

      - name: Integration tests (fake apps, real deletes, admin helper)
        shell: pwsh
        run: ./tests/integration.ps1 -Exe dist/Untrail.exe

      - uses: actions/upload-artifact@v6
        with:
          name: untrail
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' dist/UntrailSetup.exe (Get-Item dist/*.zip) dist/SHA256SUMS.txt `
            --title 'Untrail ${{ github.ref_name }}' --generate-notes
