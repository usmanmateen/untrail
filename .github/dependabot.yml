version: 2
updates:
  # Untrail has no package dependencies; the workflows' pinned actions are its only third-party code.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before adopting a new release, so a compromised one is likely caught first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
